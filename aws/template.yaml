AWSTemplateFormatVersion: '2010-09-09'
Description: ScamShield Phase 2 AWS backend

Parameters:
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0

Resources:
  ScanTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ScamShield-ScanHistory-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scan_id
          AttributeType: S
      KeySchema:
        - AttributeName: scan_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ScamShield-LambdaRole-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: '*'
              - Effect: Allow
                Action: [bedrock:InvokeModel]
                Resource: '*'
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:Scan]
                Resource: !GetAtt ScanTable.Arn

  ScamShieldFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ScamShield-API-${AWS::StackName}
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref ScanTable
          MODEL_ID: !Ref ModelId
      Code:
        ZipFile: |
          import json, os, re, time, uuid, boto3
          br = boto3.client('bedrock-runtime')
          table = boto3.resource('dynamodb').Table(os.environ['TABLE_NAME'])
          MODEL = os.environ['MODEL_ID']
          ORIGIN = 'https://sampreetialive.github.io'
          SYSTEM = '''You are ScamShield, a calm scam-awareness assistant.
          Analyze a supplied message or URL for scam indicators.
          Never request or repeat passwords, OTPs, PINs, card numbers or secrets.
          Do not claim certainty. Return ONLY JSON with risk_score (0-100), risk_level (LOW/MEDIUM/HIGH), category, headline, why (array), explanation, action_plan (array of {step,priority}), and confidence (0-100).'''
          def out(status, body):
              return {'statusCode':status,'headers':{'Content-Type':'application/json','Access-Control-Allow-Origin':ORIGIN,'Access-Control-Allow-Headers':'content-type','Access-Control-Allow-Methods':'GET,POST,OPTIONS'},'body':json.dumps(body,default=str)}
          def clean(s):
              s=str(s or '').strip()
              if s.startswith('```'): s=re.sub(r'^```(?:json)?\s*','',s); s=re.sub(r'\s*```$','',s)
              a,b=s.find('{'),s.rfind('}')
              return s[a:b+1] if a>=0 and b>a else s
          def handler(event):
              http=event.get('requestContext',{}).get('http',{}); method=http.get('method','GET'); path=http.get('path','/')
              if method=='OPTIONS': return out(204,{})
              if method=='GET' and path.endswith('/history'):
                  items=table.scan(Limit=8).get('Items',[]); items.sort(key=lambda x:x.get('created_at',''),reverse=True)
                  return out(200,{'scans':[{'scan_id':x.get('scan_id'),'input_type':x.get('input_type'),'content_preview':x.get('content_preview'),'risk_score':int(x.get('risk_score',0)),'risk_level':x.get('risk_level'),'category':x.get('category'),'created_at':x.get('created_at')} for x in items]})
              if method=='POST' and path.endswith('/analyze'):
                  try: body=json.loads(event.get('body') or '{}')
                  except: body={}
                  msg=str(body.get('message','')).strip(); url=str(body.get('url','')).strip()
                  if not msg and not url: return out(400,{'error':'Paste a message or add a link to analyze.'})
                  if len(msg)>12000: return out(400,{'error':'Please keep the message under 12,000 characters.'})
                  if url and not (url.startswith('http://') or url.startswith('https://')): return out(400,{'error':'Links must start with http:// or https://.'})
                  prompt=('MESSAGE:\n'+msg if msg else '') + ('\n\nURL:\n'+url if url else '')
                  try:
                      r=br.converse(modelId=MODEL,system=[{'text':SYSTEM}],messages=[{'role':'user','content':[{'text':prompt}]}],inferenceConfig={'maxTokens':1200,'temperature':0.2})
                      txt=''.join(c.get('text','') for c in r.get('output',{}).get('message',{}).get('content',[])); a=json.loads(clean(txt))
                      a['risk_score']=max(0,min(100,int(a.get('risk_score',0)))); a['confidence']=max(0,min(100,int(a.get('confidence',0))))
                      sid=str(uuid.uuid4()); now=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
                      table.put_item(Item={'scan_id':sid,'input_type':'link' if url and not msg else 'message','content_preview':(msg or url)[:500],'risk_score':a['risk_score'],'risk_level':a.get('risk_level','MEDIUM'),'category':a.get('category','Other'),'result_json':json.dumps(a),'created_at':now,'expires_at':int(time.time())+7776000})
                      return out(200,{'analysis':a,'agent_used_tools':False,'scan_id':sid})
                  except Exception as e:
                      print(repr(e)); return out(500,{'error':'ScamShield could not complete the analysis. Check Lambda logs and Bedrock model access.'})
              return out(404,{'error':'Not found.'})
          def lambda_handler(event, context): return handler(event)

  ScamShieldApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ScamShield-API-${AWS::StackName}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['https://sampreetialive.github.io']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ScamShieldApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ScamShieldFunction.Arn
      PayloadFormatVersion: '2.0'

  AnalyzeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScamShieldApi
      RouteKey: POST /analyze
      Target: !Sub integrations/${Integration}

  HistoryRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ScamShieldApi
      RouteKey: GET /history
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ScamShieldApi
      StageName: '$default'
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScamShieldFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ScamShieldApi}/*

Outputs:
  ApiBaseUrl:
    Value: !GetAtt ScamShieldApi.ApiEndpoint
  ModelId:
    Value: !Ref ModelId
  TableName:
    Value: !Ref ScanTable