name: Validate ScamShield

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --input-type=module --check < app.js && node --check aws/strands-agent/src/agent.ts && node --check aws/strands-agent/src/tools.ts
